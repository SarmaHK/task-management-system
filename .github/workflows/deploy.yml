name: Deploy Task Management System

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/task-management-system"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/task-management-system
            # Remove orphaned files that scp doesn't delete automatically
            rm -f backend/src/controllers/search.controller.ts
            rm -f backend/src/routes/search.routes.ts
            # Bring down the old containers
            docker compose down
            # Build and start new containers
            docker compose up -d --build
            # Clean up dangling images
            docker image prune -f